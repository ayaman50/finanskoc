name: Android APK Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flet ve APK Araclarini Yukle
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==0.28.3"

      - name: Proje Yapilandirmasini Hazirla
        run: |
          cat << 'EOF' > pyproject.toml
          [project]
          name = "finanskoc"
          version = "1.0.0"
          description = "Akilli Mobil Butce ve Finans Kocu"
          requires-python = ">=3.9"
          dependencies = [
              "flet==0.28.3"
          ]

          [tool.flet]
          org = "com.alperen"
          product = "FinansKoc"
          company = "FinansKoc"
          copyright = "Copyright (C) 2026 by Alperen"

          [tool.flet.app]
          path = "."
          EOF
          echo "flet==0.28.3" > requirements.txt

      - name: Android APK Olustur
        run: |
          flet build apk --no-rich-output -vv

      - name: APK Dosyasini Indirilebilir Paket Yap
        uses: actions/upload-artifact@v4
        with:
          name: FinansKoc-Android-APK
          path: build/apk/*.apk
